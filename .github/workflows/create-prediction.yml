name: Create prediction video
run-name: "${{ inputs.validate_only && 'Check' || 'Create' }} prediction · ${{ inputs.match }}"
on:
  workflow_dispatch:
    inputs:
      match:
        description: 'Fixture ID or both teams (any subscribed competition)'
        required: true
        type: string
      auto_retry:
        description: 'Wait for the final hour; missing lineups never delay production'
        required: true
        default: true
        type: boolean
      validate_only:
        description: 'Check setup and match window only; do not generate or upload'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      fixture_id: ${{ steps.readiness.outputs.fixture_id }}
    env:
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      MATCH_INPUT: ${{ inputs.match }}
      CLOUD_AUTO_RETRY: ${{ inputs.auto_retry }}
      CLOUD_VALIDATE_ONLY: ${{ inputs.validate_only }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Wait for the final-hour window (lineups optional)
        id: readiness
        run: python -m backend.cloud_workflow readiness
  create:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    concurrency:
      group: factory-private-upload
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      PLAYER_MEDIA_CATALOG_JSON: ${{ secrets.PLAYER_MEDIA_CATALOG_JSON }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      MATCH_INPUT: ${{ inputs.match }}
      CLOUD_AUTO_RETRY: ${{ inputs.auto_retry }}
      CLOUD_VALIDATE_ONLY: ${{ inputs.validate_only }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Set up cached rendering tools
        uses: ./.github/actions/setup-rendering
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare secure credentials and recover upload state
        id: prepare
        run: python -m backend.cloud_workflow prepare
      - name: Create video and upload privately
        env:
          READY_FIXTURE_ID: ${{ needs.readiness.outputs.fixture_id }}
        run: python -m backend.cloud_workflow create
      - name: Encrypt upload state
        if: always() && steps.prepare.outputs.state_ready == 'true'
        run: python -m backend.cloud_workflow export
      - name: Preserve encrypted upload state
        if: always() && steps.prepare.outputs.state_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-private-state
          path: .factory-state/receipts.enc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
