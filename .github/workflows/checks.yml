name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Set up cached rendering tools
        uses: ./.github/actions/setup-rendering
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/test_workflow_client.mjs tests/test_session_client.mjs auth-worker/test/*.test.mjs
      - run: python -m pytest -q
      - name: Check optional FIFA table access
        run: python -m backend.fifa_rankings --diagnostics --codes BRA SGP
